; Ajustes de PHP solo para desarrollo local (docker-compose.yml).
; Se carga después de php.ini de producción y lo sobrescribe.

display_errors = On
expose_php = On

; En producción OPcache no revisa los archivos (validate_timestamps = 0).
; En local hay que verlos cambiar sin reiniciar el contenedor.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
